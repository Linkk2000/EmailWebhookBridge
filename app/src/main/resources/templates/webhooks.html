<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Webhook Management - EmailWebhookBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">EmailWebhookBridge</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/webhooks">Webhook 管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logs/process">放行记录</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logs/push">推送日志</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Webhook 配置管理</h2>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            <span th:text="${errorMessage}">错误信息</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card mb-4 mt-3">
            <div class="card-header">添加新 Webhook</div>
            <div class="card-body">
                <form action="#" th:action="@{/webhooks}" th:object="${newWebhook}" method="post"
                    class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <input type="text" class="form-control" th:field="*{name}" placeholder="备注名称 (例如: 飞书群)">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" th:field="*{url}"
                            placeholder="Webhook URL (https://...)" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-success">添加 Webhook</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>URL</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="webhook : ${webhooks}">
                    <td th:text="${webhook.id}">1</td>
                    <td th:text="${webhook.name}">Default</td>
                    <td th:text="${webhook.url}">https://example.com</td>
                    <td>
                        <span th:if="${webhook.enabled}" class="badge bg-success">启用</span>
                        <span th:unless="${webhook.enabled}" class="badge bg-secondary">禁用</span>
                    </td>
                    <td th:text="${#temporals.format(webhook.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00</td>
                    <td>
                        <a th:href="@{/webhooks/toggle/{id}(id=${webhook.id})}" class="btn btn-sm"
                            th:classappend="${webhook.enabled} ? 'btn-warning' : 'btn-success'"
                            th:text="${webhook.enabled} ? '禁用' : '启用'">禁用</a>

                        <a th:href="@{/webhooks/delete/{id}(id=${webhook.id})}" class="btn btn-danger btn-sm"
                            onclick="return confirm('确定要移除此 Webhook 吗？');">移除</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(webhooks)}">
                    <td colspan="6" class="text-center">暂无配置，请添加。</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
