spring:
  application:
    name: EmailWebhookBridge
  datasource:
    url: jdbc:h2:file:./data/scadb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false


smtp:
  port: 2525

app:
  async:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 500
    thread-name-prefix: "EmailProc-"

sca:
  webhook:
    url: "http://localhost:8080/callback" # 设置为您的实际 Webhook 地址以启用解析转发功能
