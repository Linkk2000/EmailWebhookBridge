spring:
  application:
    name: EmailWebhookBridge
  profiles:
    # 默认激活开发环境 (H2)
    # 切换为 prod 即可启用 MySQL 生产环境 (详见 application-prod.yml 说明)
    active: dev



smtp:
  port: 2525

app:
  async:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 500
    thread-name-prefix: "EmailProc-"


