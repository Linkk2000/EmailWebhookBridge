spring:
  application:
    name: EmailWebhookBridge
  profiles:
    # 默认激活开发环境 (H2)
    # 切换为 prod 即可启用 MySQL 生产环境 (详见 application-prod.yml 说明)
    active: dev
  security:
    user:
      name: admin
      password: admin@2026  # 本地测试默认密码



smtp:
  port: 2525

app:
  async:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 500
    thread-name-prefix: "EmailProc-"

sca:
  # 通过 SCA OpenAPI 反查邮件里没有的 taskId / applicationId。
  # base-url 或 token 任一为空则整个补全环节跳过，行为与未接入时一致。
  # 推送目标不在这里配，完全由数据库中的 Webhook 配置决定。
  openapi:
    base-url: "" # SCA OpenAPI 地址，独立端口不带 /sca，例如 https://sca.example.com:30002
    token: "" # SCA 个人中心生成的 OpenApiUserToken，不需要登录换 webToken
    connect-timeout-seconds: 5
    read-timeout-seconds: 5
    # 内网 SCA 多为自签证书，JDK 默认 truststore 会直接握手失败。
    # 置 true 可跳过证书与主机名校验，只影响本客户端，不动全局 SSL 设置。
    skip-ssl-verify: false
    page-size: 50 # vcs/list 单页上限，只取第一页
    # 邮件【】里的来源名识别不了时使用的 type 值。
    # 4=通用Git 5=SVN 14=GitLab_CICD流水线 16=Gitee Go
    # 22=GitLab_V3 23=GitLab_V4 24=Gitee开源版 25=Gitee企业版
    default-type: 23

  enrichment:
    # 补全失败时是否拦截推送。默认 false：拦截会让下游收不到扫描完成通知，
    # 属于功能退化；放行只是 taskId/分支两栏留空，与改造前一致。
    block-on-failure: false
    # 邮件「检测完成时间」与 SCA detectEndTime 允许的秒级误差，0 为精确匹配。
    # 时间对不上说明拿到的不是这封邮件对应的那次扫描，宁可留空也不写错的 ID。
    time-tolerance-seconds: 0
    # 三字段全等仍命中多条时最多逐条核对几条，超过则放弃补全。
    max-candidates: 3
