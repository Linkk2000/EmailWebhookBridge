# 生产环境配置
# 默认使用 H2 文件数据库以确保开箱即用。
# 如需切换为 MySQL，请取消下方 MySQL 区域的注释并配置相关参数。

spring:
  datasource:
    # 默认 H2 配置
    url: jdbc:h2:file:./data/scadb_prod
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

